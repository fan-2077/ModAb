<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModAb · 研究任务</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f3;color:#213d36;font:16px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:36px auto;padding:0 22px}header{display:flex;align-items:baseline;justify-content:space-between;gap:20px}h1{font-size:28px;margin:0}h2{font-size:20px;margin:0 0 12px}.sub{color:#567268}section,article{background:white;border:1px solid #d5e2d9;border-radius:12px;padding:22px;margin:22px 0}label{display:block;font-weight:600;margin:14px 0 6px}textarea,select{width:100%;padding:11px;font:inherit;border:1px solid #b3c8bb;border-radius:6px}textarea{min-height:100px}button{font:inherit;background:#225e4c;color:white;border:0;border-radius:6px;padding:9px 16px;cursor:pointer;margin:6px 8px 6px 0}button.secondary{background:#e9f0eb;color:#244e3f}button:disabled{opacity:.5;cursor:default}.tag{display:inline-block;font-size:13px;background:#eef2dd;border-radius:5px;padding:3px 8px}.row{display:flex;justify-content:space-between;gap:16px}.mono{font:12px ui-monospace,monospace;overflow-wrap:anywhere;color:#657970}dl{display:grid;grid-template-columns:140px 1fr;gap:4px 12px}dt{color:#657970}dd{margin:0}details{margin-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#176149}#error{color:#a02828}li{margin:6px 0}@media(max-width:600px){header,.row{display:block}dl{grid-template-columns:1fr}section,article{padding:16px}}
</style>
<main><header><h1>ModAb · 研究任务</h1><span class="sub">任务持续运行，关闭页面后仍可恢复查看</span></header>
<section><h2>发起研究任务</h2><label for="profile">数据与资源范围</label><select id="profile"></select><p class="sub" id="scope"></p><label for="objective">研究目标</label><textarea id="objective" placeholder="描述要回答的问题、约束和你希望得到的结果"></textarea><button id="draft">查看任务委托</button><p id="error" role="alert"></p></section>
<div id="missions" aria-live="polite"></div><p class="sub">已核验事实、待检验解释和实际执行状态分别保存。网页模型可提出任务；资源委托由用户确认。</p></main>
<script>
const token='__CONTROL_TOKEN__';let state,chosen='',renderedSignature='';
const labels={DRAFT:'待确认',QUEUED:'准备推进',RUNNING:'正在运行',PAUSED:'已暂停',UNKNOWN:'原请求状态待核对',NEEDS_INPUT:'需要补充信息',NEEDS_ATTENTION:'需要处理',COMPLETED:'已完成',COMPLETED_WITH_LIMITATIONS:'已交付，保留限制',FAILED:'失败',CANCELLING:'正在取消',CANCELLED:'已取消',BUDGET_EXHAUSTED:'预算已用尽'};
const escape=value=>String(value??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function post(path,body){document.querySelector('#error').textContent='';const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-ModAb-Control':token},body:JSON.stringify(body)});const value=await r.json();if(!r.ok)throw Error(value.error);return value;}
function scope(){const p=state.profiles[document.querySelector('#profile').value];document.querySelector('#scope').textContent=p.description+(p.activation_ready?'':' 当前资源尚待准备，任务可保存为草案。');}
async function refresh(){const r=await fetch('/api/state');state=await r.json();const sel=document.querySelector('#profile');if(!sel.options.length){sel.innerHTML=Object.entries(state.profiles).map(([id,p])=>`<option value="${escape(id)}">${escape(p.label)}</option>`).join('');scope();}const signature=JSON.stringify(state.missions);if(signature===renderedSignature)return;renderedSignature=signature;
document.querySelector('#missions').innerHTML=state.missions.slice().reverse().map(m=>{const b=m.commission.budget;const terminal=['COMPLETED','COMPLETED_WITH_LIMITATIONS','CANCELLED','FAILED','BUDGET_EXHAUSTED'].includes(m.status);return `<article data-id="${m.mission_id}"><div class="row"><h2>${escape(m.commission.objective)}</h2><span class="tag">${escape(labels[m.status]||m.status)}</span></div><p>${escape(m.reason||'')}</p><p class="mono">${m.mission_id}</p><dl><dt>运行性质</dt><dd>${m.commission.evidence_kind==='ENGINEERING_FIXTURE_ONLY'?'工程验证，使用记录方案，无在线模型决策':'计算研究任务'}</dd><dt>预算上限</dt><dd>模型 ${b.model_requests===null?'不限次数':b.model_requests+' 次'} / ${b.model_tokens} 令牌；工具 ${b.job_attempts} 次 / ${b.compute_seconds} 秒；并发 ${b.max_concurrent_jobs}</dd><dt>已记账或预留</dt><dd>${escape(JSON.stringify(m.usage))}</dd><dt>工具范围</dt><dd>${escape(m.commission.allowed_tools.join('、'))}</dd><dt>停止条件</dt><dd>${escape(m.commission.stop_conditions.join('；'))}</dd></dl>${m.status==='DRAFT'?`<button data-action="approve" data-sha="${m.commission_sha256}">确认此委托并启动</button>`:!terminal?'<button class="secondary" data-action="pause">暂停后续步骤</button><button class="secondary" data-action="resume">继续</button><button class="secondary" data-action="cancel">取消任务</button>':''}${m.reports.length?`<a href="/report/${m.mission_id}" target="_blank">查看证据报告</a>`:''}<ul>${m.steps.map(s=>`<li>${escape(s.tool_id)} · ${escape(s.status)}${s.receipt?' · 退出码 '+escape(s.receipt.process_exit_code):''}</li>`).join('')}</ul><details><summary>查看完整委托与决策依据</summary><pre>${escape(JSON.stringify({commission:m.commission,decisions:m.decisions.map(d=>({status:d.status,decision:d.document,error:d.error}))},null,2))}</pre></details></article>`}).join('');}
document.querySelector('#profile').onchange=scope;
document.querySelector('#draft').onclick=async()=>{try{await post('/api/draft',{profile_id:document.querySelector('#profile').value,objective:document.querySelector('#objective').value,request_id:'web_'+crypto.randomUUID().replaceAll('-','')});await refresh()}catch(e){document.querySelector('#error').textContent=e.message}};
document.querySelector('#missions').onclick=async e=>{const action=e.target.dataset.action;if(!action)return;const mid=e.target.closest('article').dataset.id;try{await post(action==='approve'?'/api/approve':'/api/control',action==='approve'?{mission_id:mid,commission_sha256:e.target.dataset.sha}:{mission_id:mid,action});await refresh()}catch(e){document.querySelector('#error').textContent=e.message}};
refresh().catch(e=>document.querySelector('#error').textContent=e.message);setInterval(()=>{if(!document.hidden)refresh().catch(()=>{})},3000);
</script></html>
